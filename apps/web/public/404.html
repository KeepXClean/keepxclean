<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — KeepXClean</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <style>
      :root {
        --canvas: #f7f9f8;
        --surface: #ffffff;
        --border: #e1e7e3;
        --text: #172b24;
        --muted: #607168;
        --green: #13865f;
        --green-hover: #0f6e4e;
        --selected: #eaf6ef;
        --radius-lg: 14px;
        --radius-pill: 9999px;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--canvas);
        color: var(--text);
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      .shell {
        width: 100%;
        max-width: 520px;
        padding: 24px;
      }
      .hero-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 4px 16px rgba(23, 43, 36, 0.06);
      }
      .brand-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 12px;
        background: var(--selected);
        margin-bottom: 20px;
      }
      .brand-mark img {
        width: 36px;
        height: 36px;
        display: block;
      }
      .error-badge {
        display: inline-block;
        padding: 3px 10px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--green);
        background: var(--selected);
        border-radius: var(--radius-pill);
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--text);
      }
      .hero-lead {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
      }
      .cta-row {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        border-radius: var(--radius-pill);
        text-decoration: none;
        transition: all 180ms ease;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
      }
      .btn:hover {
        background: #f2f5f3;
        border-color: #d3dbd6;
      }
      .btn-primary {
        background: var(--green);
        color: #ffffff;
        border-color: var(--green);
      }
      .btn-primary:hover {
        background: var(--green-hover);
        border-color: var(--green-hover);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="hero-card">
          <div class="brand-mark">
            <img src="/logo.svg" alt="KeepXClean Logo" width="36" height="36" />
          </div>
          <div class="error-badge">404 Error</div>
          <h1>Page not found</h1>
          <p class="hero-lead">The page you requested does not exist on keepxclean.com.</p>
          <div class="cta-row">
            <a class="btn btn-primary" href="/">Back to KeepXClean</a>
            <a class="btn" href="/privacy/">Privacy Policy</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>

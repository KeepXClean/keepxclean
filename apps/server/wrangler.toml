name = "keepxclean-api"
account_id = "fac906e305f0f4df576524f107365e35"
main = "src/index.ts"
compatibility_date = "2025-02-01"

# Custom Domain Routes for keepxclean.com
routes = [
  { pattern = "api.keepxclean.com", custom_domain = true },
  { pattern = "cdn.keepxclean.com", custom_domain = true }
]

[vars]
SITE_DOMAIN = "keepxclean.com"
MIN_SNAPSHOT_BLOCK_COUNT = "2"

# Cron Trigger: Every 10 minutes compile D1 block counts into snapshot cache
[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "keepxclean-db"
database_id = "28bf859e-ba09-44fd-9c19-52df001a14c7"
migrations_dir = "migrations"

# Optional R2 bucket: when R2 is enabled on the Cloudflare account, uncomment below.
# When omitted, compiled snapshots are served from D1 `snapshot_cache` + Cloudflare CDN Edge cache.
# [[r2_buckets]]
# binding = "SNAPSHOT_BUCKET"
# bucket_name = "keepxclean-snapshots"
